; Runs nginx and the API as sibling processes in one container. Docker only
; watches PID 1 (supervisord here), so autorestart is what keeps either
; process coming back up if it crashes.
[supervisord]
nodaemon=true
user=root

[program:api]
command=dotnet /app/PictureManager.Api.dll
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
