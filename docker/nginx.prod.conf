map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # /pm  ->  /pm/
    location = /pm { return 301 /pm/; }

    location /pm/ {
        # The trailing "/" strips the prefix: /pm/api/users -> :5080/api/users
        proxy_pass http://host.docker.internal:5080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pm;
        proxy_set_header Upgrade           $http_upgrade;      # WebSockets/SignalR
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

