worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /app/wwwroot;
        index index.html;

        # REST API: proxied to Kestrel, which only listens on loopback (see
        # ASPNETCORE_URLS in Dockerfile.nginx) — nginx is the only public entry point.
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA: serve the built asset if it exists, otherwise fall back to index.html
        # so client-side routing handles the path.
        location / {
            try_files $uri /index.html;
        }
    }
}
