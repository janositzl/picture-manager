map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dminipc.crt;
    ssl_certificate_key /etc/nginx/certs/dminipc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # /pm  ->  /pm/
    location = /pm { return 301 /pm/; }

    location /pm/ {  
        # The trailing "/" strips the prefix: /pm/api/users -> :5080/api/users
        proxy_pass http://host.docker.internal:5080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pm;
        proxy_set_header Upgrade           $http_upgrade;      # WebSockets/SignalR
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

