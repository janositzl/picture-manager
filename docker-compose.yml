# Local development only. POSTGRES_* defaults below are placeholder credentials for a database
# explicitly bound to localhost only (port 5432 on 127.0.0.1). Never reuse these defaults, and
# never publish this port, on any shared or internet-facing host: override POSTGRES_PASSWORD (and
# ideally POSTGRES_USER) via a local .env file (gitignored; see .env.example) before running this
# anywhere but a developer workstation.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picturemanager}
      POSTGRES_USER: ${POSTGRES_USER:-picturemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picturemanager}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-picturemanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
