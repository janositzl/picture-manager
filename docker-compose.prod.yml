# Deployment compose file: builds and runs the PictureManager API together
# with its PostgreSQL database. See Documents/PictureManager-Docker-Deployment-Guide.md
# for configuration and operating instructions.
#
# docker-compose.yml (no suffix) stays reserved for the local-dev, db-only setup;
# this file is the one you use for an actual deployment:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    build:
      context: ./docker/postgres
    image: picturemanager-postgres:17-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picturemanager}
      POSTGRES_USER: ${POSTGRES_USER:-picturemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-picturemanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - picturemanager

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PictureManagerDb: Host=db;Port=5432;Database=${POSTGRES_DB:-picturemanager};Username=${POSTGRES_USER:-picturemanager};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ThumbnailCache__RootPath: /data/thumbnail-cache
      ThumbnailCache__PreviewEnabled: "true"
      ImageRoots__0__Name: ${IMAGE_ROOT_NAME:-library}
      ImageRoots__0__MountPath: /data/images
      # Initial password for the "admin" account; used only while no admin has a password. Changed at first login.
      Auth__InitialAdmin__Password: ${PM_ADMIN_PASSWORD:?Set PM_ADMIN_PASSWORD in .env}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - ${IMAGE_LIBRARY_PATH}:/data/images:ro
      - thumbnail-cache:/data/thumbnail-cache
      - api-logs:/app/logs
    networks:
      - picturemanager

volumes:
  pgdata:
  thumbnail-cache:
  api-logs:

networks:
  picturemanager:
